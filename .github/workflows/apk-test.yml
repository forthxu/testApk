name: test APK

on:
  schedule:
    - cron:  '0 0 * * MON'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # 首次需要创建 AVD 快照，15 分钟不够
    strategy:
      matrix:
        api-level: [30]
        # API 30+ emulators only have x86_64 system images.
        arch: ["x86_64"]
        target: [default]  # Other option: google_apis
    steps:
      # 1. 检查代码库
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 准备结果目录（APK 已随仓库提交在 apps/ 下）
      - name: Prepare directories
        run: mkdir -p results

      # 3. 设置 Java 环境
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. 开启 KVM 硬件加速
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 5. AVD 缓存（AVD 实际存放在 ~/.android 下）
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.arch }}-${{ matrix.target }}

      # 6. 缓存未命中时创建 AVD 并生成快照
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # 7. 在模拟器中安装、启动、抓日志、截图、查崩溃
      #    注意：模拟器只在本步骤的 script 执行期间存活，所有 adb 操作必须写在这里
      - name: Run APK test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euo pipefail
            adb devices
            adb logcat -c

            echo "Installing APK..."
            adb install -r -g ./apps/caipiao-2.1.apk

            echo "Verifying installation..."
            if ! adb shell pm list packages | tr -d '\r' | grep -qx "package:com.kaijiang.caipiao"; then
              echo "APK installation failed: Package not found!"
              adb logcat -d > ./results/log.txt
              exit 1
            fi

            echo "Launching APK..."
            adb shell am start -W -n com.kaijiang.caipiao/.ui.main.MainActivity | tee ./results/launch.txt
            sleep 15  # 等待应用加载完成

            adb exec-out screencap -p > ./results/screenshot.png
            adb logcat -d > ./results/log.txt
            adb shell dumpsys package com.kaijiang.caipiao > ./results/package.txt || true

            if grep -q "Error:" ./results/launch.txt; then
              echo "Failed to launch APK!"
              exit 1
            fi

            if [ -z "$(adb shell pidof com.kaijiang.caipiao | tr -d '\r')" ]; then
              echo "App is not running after launch!"
              exit 1
            fi

            if grep -qE "FATAL EXCEPTION|ANR in com.kaijiang.caipiao" ./results/log.txt; then
              echo "App crashed! Check log.txt for details."
              exit 1
            fi

            echo "No crashes detected."

      # 8. 上传日志和截图
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-results
          path: ./results/
          if-no-files-found: warn

      # 9. 失败或者取消时通知
      - name: Notify on Failure
        if: failure() || cancelled()
        env:
          NOTICE_KEY: ${{ secrets.NOTICE_KEY }}
        run: |
          [ -n "${NOTICE_KEY}" ] || { echo "NOTICE_KEY not set, skip notify"; exit 0; }
          curl -fsS -m 15 --get "https://notice.api.cn/notice/content/send/" \
            --data-urlencode "text=testApk" \
            --data-urlencode "desp=${{ github.job }} fail" \
            --data-urlencode "sendkey=${NOTICE_KEY}" || true
