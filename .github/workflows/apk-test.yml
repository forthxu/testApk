name: test APK

on:
  schedule:
    - cron:  '0 0 * * MON'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # 首次需要创建 AVD 快照，15 分钟不够
    strategy:
      matrix:
        api-level: [30]
        # API 30+ emulators only have x86_64 system images.
        arch: ["x86_64"]
        target: [default]  # Other option: google_apis
    steps:
      # 1. 检查代码库
      - name: Checkout Code
        uses: actions/checkout@v7

      # 2. 准备结果目录（APK 已随仓库提交在 apps/ 下）
      - name: Prepare directories
        run: mkdir -p results

      # 3. 设置 Java 环境
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. 开启 KVM 硬件加速
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 5. AVD 缓存（AVD 实际存放在 ~/.android 下）
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.arch }}-${{ matrix.target }}

      # 6. 缓存未命中时创建 AVD 并生成快照
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # 7. 在模拟器中安装、启动、抓日志、截图、查崩溃
      #    注意：模拟器只在本步骤的 script 执行期间存活，所有 adb 操作必须写在这里
      - name: Run APK test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none
          disable-animations: true
          # 注意：这里的 script 由 sh(dash) 执行，必须显式用 bash 跑测试脚本
          script: bash ./scripts/apk-test.sh

      # 8. 上传日志和截图
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-results
          path: ./results/
          if-no-files-found: warn

      # 9. 失败或者取消时通知
      - name: Notify on Failure
        if: failure() || cancelled()
        env:
          NOTICE_KEY: ${{ secrets.NOTICE_KEY }}
        run: |
          [ -n "${NOTICE_KEY}" ] || { echo "NOTICE_KEY not set, skip notify"; exit 0; }
          curl -fsS -m 15 --get "https://notice.api.cn/notice/content/send/" \
            --data-urlencode "text=testApk" \
            --data-urlencode "desp=${{ github.job }} fail" \
            --data-urlencode "sendkey=${NOTICE_KEY}" || true
